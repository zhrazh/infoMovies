<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>infoMovies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="infoMovies.css">
</head>
<body>
    <header id="mainHeader" class="navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a id="appBranding" class="navbar-brand" href="https://github.com/zhrazh/infoMovies/tree/main">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span>infoMovies</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-collapse" id="mainNavbar">
                <nav class="navbar-nav ms-auto" aria-label="Navigasi utama">
                    <a class="nav-link" href="index.html">Dashboard</a>
                    <a class="nav-link active" href="log.html" aria-current="page">+Log</a>
                    <a class="nav-link" href="film.html">Film</a>
                    <a class="nav-link" href="rek.html">Recommendation</a>
                    <a class="nav-link" href="search.html">Search</a>
                    <a class="nav-link" href="setting.html">Setting</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <h2>Add to your log..</h2>
        <form>
            <fieldset>
                <legend>Movie Log Entry</legend>
                <label for="movieTitle">Movie Title:</label>
                <input class="form-control" type="text" id="movieTitle" name="movieTitle" required><br><br>

                <label for="director">Director:</label>
                <input class="form-control" type="text" id="director" name="director"><br><br>

                <label for="genre">Genre:</label>
                <input class="form-check-input" type="checkbox" name="genre_input" id="action" value="Action">
                    <label for="action">Action</label>
                <input class="form-check-input" type="checkbox" name="genre_input" id="comedy" value="Comedy">
                    <label for="comedy">Comedy</label>
                <input class="form-check-input" type="checkbox" name="genre_input" id="drama" value="Drama">
                    <label for="drama">Drama</label>
                <input class="form-check-input" type="checkbox" name="genre_input" id="horror" value="Horror">
                    <label for="horror">Horror</label>
                <input class="form-check-input" type="checkbox" name="genre_input" id="romance" value="Romance">
                    <label for="romance">Romance</label>
                <input class="form-check-input" type="checkbox" name="genre_input" id="sci-fi" value="Sci-Fi">
                    <label for="sci-fi">Sci-Fi</label>
                <input class="form-check-input" type="checkbox" name="genre_input" id="thriller" value="Thriller">
                    <label for="thriller">Thriller</label><br><br>

                <label for="watchedDate">Watched on </label>
                <input class="form-control" type="date" id="watchedDate" name="watchedDate"><br><br>

                <label for="rating">Rating:</label>
                <select id="rating" name="rating">
                    <option value="">Select Rating</option>
                    <option value="G">G</option>
                    <option value="PG">PG</option>
                    <option value="PG-13">PG-13</option>
                    <option value="R">R</option>
                    <option value="NC-17">NC-17</option>
                </select><br><br>

                <label for="rate">Rate the movie:</label>
                <input class="form-check-input" type="radio" name="rate" id="1" value="1">
                    <label for="1">1</label>
                <input class="form-check-input" type="radio" name="rate" id="2" value="2">
                    <label for="2">2</label>
                <input class="form-check-input" type="radio" name="rate" id="3" value="3">
                    <label for="3">3</label>
                <input class="form-check-input" type="radio" name="rate" id="4" value="4">
                    <label for="4">4</label>
                <input class="form-check-input" type="radio" name="rate" id="5" value="5">
                    <label for="5">5</label><br><br>

                <label for="review">Review:</label><br>
                <textarea class="form-control" id="review" name="review" rows="5" cols="50"></textarea><br><br>

                <button class="btn-warning" type="submit">Add to Log</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 infoMovies. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
