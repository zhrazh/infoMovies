<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>infoMovies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="mainHeader">
        <h1><a id="appBranding" href="https://github.com/zhrazh/infoMovies/tree/main">infoMovies</a><h1>
        <nav role="navigation">
            <a href="index.html">Dashboard</a>
            <a href="log.html">+Log</a>
            <a href="film.html">Film</a>
            <a href="rek.html">Recommendation</a>
            <a href="search.html">Search</a>
            <a href="setting.html">Setting</a>
        </nav>
    </header>

    <main>
        <h2>Add to your log..</h2>
        <form>
            <fieldset>
                <legend>Movie Log Entry</legend>
                <label for="movieTitle">Movie Title:</label>
                <input type="text" id="movieTitle" name="movieTitle" required><br><br>

                <label for="director">Director:</label>
                <input type="text" id="director" name="director"><br><br>

                <label for="genre">Genre:</label>
                <input type="checkbox" name="genre_input" id="action" value="Action">
                    <label for="action">Action</label>
                <input type="checkbox" name="genre_input" id="comedy" value="Comedy">
                    <label for="comedy">Comedy</label>
                <input type="checkbox" name="genre_input" id="drama" value="Drama">
                    <label for="drama">Drama</label>
                <input type="checkbox" name="genre_input" id="horror" value="Horror">
                    <label for="horror">Horror</label>
                <input type="checkbox" name="genre_input" id="romance" value="Romance">
                    <label for="romance">Romance</label>
                <input type="checkbox" name="genre_input" id="sci-fi" value="Sci-Fi">
                    <label for="sci-fi">Sci-Fi</label>
                <input type="checkbox" name="genre_input" id="thriller" value="Thriller">
                    <label for="thriller">Thriller</label><br><br>

                <label for="watchedDate">Watched on </label>
                <input type="date" id="watchedDate" name="watchedDate"><br><br>

                <label for="rating">Rating:</label>
                <select id="rating" name="rating">
                    <option value="">Select Rating</option>
                    <option value="G">G</option>
                    <option value="PG">PG</option>
                    <option value="PG-13">PG-13</option>
                    <option value="R">R</option>
                    <option value="NC-17">NC-17</option>
                </select><br><br>

                <label for="rate">Rate the movie:</label>
                <input type="radio" name="rate" id="1" value="1">
                    <label for="1">1</label>
                <input type="radio" name="rate" id="2" value="2">
                    <label for="2">2</label>
                <input type="radio" name="rate" id="3" value="3">
                    <label for="3">3</label>
                <input type="radio" name="rate" id="4" value="4">
                    <label for="4">4</label>
                <input type="radio" name="rate" id="5" value="5">
                    <label for="5">5</label><br><br>

                <label for="review">Review:</label><br>
                <textarea id="review" name="review" rows="5" cols="50"></textarea><br><br>

                <button type="submit">Add to Log</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 infoMovies. All rights reserved.</p>
    </footer>
</body>
</html>
