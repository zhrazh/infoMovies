<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>infoMovies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="infoMovies.css">
</head>

<body>
    <header id="mainHeader" class="navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a id="appBranding" class="navbar-brand" href="https://github.com/zhrazh/infoMovies/tree/main">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span>infoMovies</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <nav class="navbar-nav ms-auto" aria-label="Navigasi utama">
                    <a class="nav-link" href="index.html">Dashboard</a>
                    <a class="nav-link" href="log.html">+Log</a>
                    <a class="nav-link" href="film.html">Film</a>
                    <a class="nav-link active" href="rek.html" aria-current="page">Recommendation</a>
                    <a class="nav-link" href="search.html">Search</a>
                    <a class="nav-link" href="setting.html">Setting</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <h2>Movie Recommendations</h2>
        <p>Pilih genre favoritmu untuk melihat rekomendasi film dari katalog infoMovies.</p>
        <div class="genre-filter-bar d-flex flex-wrap gap-2 mb-4" role="group" aria-label="Filter genre rekomendasi">
            <button type="button" class="btn btn-warning genre-filter active" data-genre="All" aria-pressed="true">All</button>
            <button type="button" class="btn btn-outline-warning genre-filter" data-genre="Action" aria-pressed="false">Action</button>
            <button type="button" class="btn btn-outline-warning genre-filter" data-genre="Adventure" aria-pressed="false">Adventure</button>
            <button type="button" class="btn btn-outline-warning genre-filter" data-genre="Comedy" aria-pressed="false">Comedy</button>
            <button type="button" class="btn btn-outline-warning genre-filter" data-genre="Crime" aria-pressed="false">Crime</button>
            <button type="button" class="btn btn-outline-warning genre-filter" data-genre="Drama" aria-pressed="false">Drama</button>
            <button type="button" class="btn btn-outline-warning genre-filter" data-genre="Fantasy" aria-pressed="false">Fantasy</button>
            <button type="button" class="btn btn-outline-warning genre-filter" data-genre="Sci-Fi" aria-pressed="false">Sci-Fi</button>
            <button type="button" class="btn btn-outline-warning genre-filter" data-genre="Thriller" aria-pressed="false">Thriller</button>
        </div>
        <p id="recommendationSummary" class="movie-summary" aria-live="polite"></p>
        <section id="recommendationResults" class="row g-4" aria-live="polite"></section>
    </main>

    <footer>
        <p>&copy; 2026 infoMovies. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="infoMovies.js"></script>
</body>

</html>
