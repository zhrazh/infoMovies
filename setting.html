<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>infoMovies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="infoMovies.css">
</head>
<body>
    <header id="mainHeader" class="navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a id="appBranding" class="navbar-brand" href="https://github.com/zhrazh/infoMovies/tree/main">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span>infoMovies</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <nav class="navbar-nav ms-auto" aria-label="Navigasi utama">
                    <a class="nav-link" href="index.html">Dashboard</a>
                    <a class="nav-link" href="log.html">+Log</a>
                    <a class="nav-link" href="film.html">Film</a>
                    <a class="nav-link" href="rek.html">Recommendation</a>
                    <a class="nav-link" href="search.html">Search</a>
                    <a class="nav-link active" href="setting.html" aria-current="page">Setting</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <h2>Edit Profile</h2>
        <form action="#" method="get">
            <fieldset>
                <legend>Informasi akun</legend>
                <p>
                    <label for="nama">Nama lengkap:</label><br>
                    <input class="form-control" type="text" id="nama" name="nama" value="MovieHub User" required>
                </p>
                <p>
                    <label for="username">Username:</label><br>
                    <input class="form-control" type="text" id="username" name="username" placeholder="Masukkan username" required>
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input class="form-control" type="email" id="email" name="email" placeholder="nama@email.com" required>
                </p>
                <p>
                    <label for="bio">Bio:</label><br>
                    <textarea class="form-control" id="bio" name="bio" rows="4" cols="40" placeholder="Ceritakan sedikit tentang dirimu"></textarea>
                </p>
            </fieldset>

            <fieldset>
                <legend>Genre favorit</legend>
                <p>
                    <input class="form-check-input" type="checkbox" id="favorit-action" name="genre-favorit" value="action">
                    <label for="favorit-action">Action</label><br>
                    
                    <input class="form-check-input" type="checkbox" id="favorit-comedy" name="genre-favorit" value="comedy">
                    <label for="favorit-comedy">Comedy</label><br>
                    
                    <input class="form-check-input" type="checkbox" id="favorit-drama" name="genre-favorit" value="drama">
                    <label for="favorit-drama">Drama</label><br>
                    
                    <input class="form-check-input" type="checkbox" id="favorit-horror" name="genre-favorit" value="horror">
                    <label for="favorit-horror">Horror</label><br>
                    
                    <input class="form-check-input" type="checkbox" id="favorit-romance" name="genre-favorit" value="romance">
                    <label for="favorit-romance">Romance</label><br>
                    
                    <input class="form-check-input" type="checkbox" id="favorit-sci-fi" name="genre-favorit" value="sci-fi">
                    <label for="favorit-sci-fi">Sci-Fi</label>
                </p>
            </fieldset>

            <p><button class="btn-warning" type="submit">Simpan Perubahan</button></p>
        </form>
        <p>Catatan: perubahan profil belum disimpan secara permanen pada versi HTML ini.</p>
    </main>

    <footer>
        <p>&copy; 2026 infoMovies. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="infoMovies.js"></script>
</body>
</html>
