<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>infoMovies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="infoMovies.css">
</head>
<body>
    <header id="mainHeader" class="navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a id="appBranding" class="navbar-brand" href="https://github.com/zhrazh/infoMovies/tree/main">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span>infoMovies</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <nav class="navbar-nav ms-auto" aria-label="Navigasi utama">
                    <a class="nav-link" href="index.html">Dashboard</a>
                    <a class="nav-link" href="log.html">+Log</a>
                    <a class="nav-link" href="film.html">Film</a>
                    <a class="nav-link" href="rek.html">Recommendation</a>
                    <a class="nav-link active" href="search.html" aria-current="page">Search</a>
                    <a class="nav-link" href="setting.html">Setting</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <h2>Search for Movies</h2>
        <div class="search-tools">
            <form id="searchForm" class="search-form" novalidate>
                <label for="searchInput">Enter movie title, genre, or director:</label>
                <div class="d-flex flex-column flex-sm-row gap-2">
                    <input class="form-control" type="search" id="searchInput" name="searchInput" placeholder="Contoh: Interstellar, Sci-Fi, Christopher Nolan" autocomplete="off">
                    <button type="submit" class="btn btn-warning">Search</button>
                    <button type="button" id="clearSearch" class="btn btn-outline-light">Clear</button>
                </div>
                <p id="searchValidation" class="form-feedback mt-2 mb-0" role="status"></p>
            </form>
            <button type="button" id="toggleSearchHelp" class="btn btn-sm btn-outline-warning mt-3">Tips pencarian</button>
            <div id="searchHelp" class="helper-panel mt-2" style="display:none">
                <strong>Tips:</strong> ketik judul film, tahun rilis, genre, atau nama sutradara. Contoh: <em>Sci-Fi</em> atau <em>Christopher Nolan</em>.
            </div>
        </div>

        <section id="searchResults" class="mt-4" aria-live="polite">
            <p class="text-muted">Masukkan kata kunci untuk menemukan film dari katalog infoMovies.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 infoMovies. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="infoMovies.js"></script>
</body>
</html>
